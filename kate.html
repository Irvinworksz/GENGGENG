<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay Binibining Kate</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff0f3;
            font-family: 'Georgia', serif;
            overflow: hidden;
            perspective: 1000px; /* Enables the 3D environment */
        }

        #main-card {
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255, 105, 180, 0.3);
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        h1 { color: #d63384; font-size: 2.8rem; margin-bottom: 10px; }
        p { color: #ff4d6d; font-size: 1.4rem; }

        .btn-container {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .yes { background: #ff4d6d; color: white; }
        .maybe { background: #ffb6c1; color: #d63384; }

        /* 3D Flower Effect */
        .flower {
            position: absolute;
            pointer-events: none;
            font-size: 40px;
            z-index: 5;
            opacity: 0;
        }

        @keyframes flyOut {
            0% {
                transform: translate(-50%, -50%) translateZ(-500px) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 1; }
            100% {
                transform: translate(var(--x), var(--y)) translateZ(600px) rotate(360deg);
                opacity: 0;
            }
        }

        /* The Blush Screen Glow */
        #blush {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,192,203,0) 30%, rgba(255,20,147,0.4) 100%);
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="blush"></div>

    <div id="main-card">
        <h1 id="title">Happy Valentine's, <br>Binibining Kate! 🌸</h1>
        <p id="message">Will you be my Valentine?</p>
        
        <div class="btn-container" id="buttons">
            <button class="yes" onclick="startMagic()">Yes!</button>
            <button class="maybe" onclick="startMagic()">Maybe? 😉</button>
        </div>
    </div>

    <script>
        function startMagic() {
            // 1. Remove the buttons smoothly
            const btnContainer = document.getElementById('buttons');
            btnContainer.style.opacity = "0";
            setTimeout(() => { btnContainer.style.display = "none"; }, 500);

            // 2. Change the text and trigger blush
            document.getElementById('title').innerHTML = "GANDA MO TALAGA NA CUTE BINIBINING KATE! 💖";
            document.getElementById('message').innerText = "ETO FLOWERSSS AYIEEE...";
            document.getElementById('blush').style.opacity = "1";

            // 3. Create 3D Flower Explosion
            const emojis = ['🌸', '🌹', '🌷', '🌺', '✨', '💐', '❤️'];
            
            for (let i = 0; i < 80; i++) {
                createFlower(emojis);
            }
        }

        function createFlower(emojis) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Random direction for 3D flight
            const xDir = (Math.random() - 0.5) * 2000 + "px";
            const yDir = (Math.random() - 0.5) * 2000 + "px";
            
            flower.style.setProperty('--x', xDir);
            flower.style.setProperty('--y', yDir);
            
            // Random starting position near center
            flower.style.left = "50%";
            flower.style.top = "50%";
            
            // Animation timing
            const duration = Math.random() * 2 + 2;
            flower.style.animation = `flyOut ${duration}s ease-out forwards`;
            
            document.body.appendChild(flower);

            // Clean up
            setTimeout(() => { flower.remove(); }, duration * 1000);
        }
    </script>
</body>
</html>
