<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para kay Binibining Kate</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff0f3;
            font-family: 'Georgia', serif;
            overflow: hidden;
            perspective: 1200px;
        }

        #main-card {
            z-index: 100; /* Keeps the card above the settled flowers */
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255, 105, 180, 0.3);
            text-align: center;
            transition: all 0.8s ease;
            border: 2px solid #ffb6c1;
        }

        h1 { color: #d63384; font-size: 2.8rem; margin-bottom: 10px; }
        p { color: #ff4d6d; font-size: 1.4rem; }

        .btn-container {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .yes { background: #ff4d6d; color: white; }
        .maybe { background: #ffb6c1; color: #d63384; }

        /* Flower Styling */
        .flower {
            position: absolute;
            pointer-events: none;
            font-size: 45px;
            z-index: 5;
            user-select: none;
        }

        /* 3D Burst Animation */
        @keyframes burstOut {
            0% {
                transform: translate(-50%, -50%) translateZ(-500px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                /* Flowers move to their final random position and stay there */
                transform: translate(var(--x), var(--y)) translateZ(0px) rotate(var(--r));
                opacity: 1;
            }
        }

        #blush {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255,192,203,0) 20%, rgba(255,20,147,0.5) 100%);
            opacity: 0;
            transition: opacity 3s ease;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="blush"></div>

    <div id="main-card">
        <h1 id="title">Happy Valentine's, <br>Binibining Kate! 🌸</h1>
        <p id="message">Will you be my Valentine?</p>
        
        <div class="btn-container" id="buttons">
            <button class="yes" onclick="startMagic()">Yes!</button>
            <button class="maybe" onclick="startMagic()">Maybe? 😉</button>
        </div>
    </div>

    <script>
        function startMagic() {
            // 1. Remove the buttons completely
            const btnContainer = document.getElementById('buttons');
            btnContainer.style.display = "none";

            // 2. Change text and start blush
            document.getElementById('title').innerHTML = "You made me blush! 😊";
            document.getElementById('message').innerHTML = "Para sa pinakamagandang binibini... <br> ❤️❤️❤️";
            document.getElementById('blush').style.opacity = "1";

            // 3. Create Persistent Flowers
            const emojis = ['🌸', '🌹', '🌷', '🌺', '💐', '❤️', '✨', '💝'];
            
            // Generate 100 flowers to fill the screen
            for (let i = 0; i < 100; i++) {
                createPersistentFlower(emojis);
            }
        }

        function createPersistentFlower(emojis) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Random destination coordinates (relative to center)
            const xDir = (Math.random() - 0.5) * 90 + "vw";
            const yDir = (Math.random() - 0.5) * 90 + "vh";
            const randomRotation = Math.random() * 360 + "deg";
            
            flower.style.setProperty('--x', xDir);
            flower.style.setProperty('--y', yDir);
            flower.style.setProperty('--r', randomRotation);
            
            flower.style.left = "50%";
            flower.style.top = "50%";
            
            // Random animation speed for natural feel
            const duration = Math.random() * 1.5 + 1; 
            flower.style.animation = `burstOut ${duration}s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards`;
            
            document.body.appendChild(flower);
            // Notice: No setTimeout to remove the flower, so they stay forever!
        }
    </script>
</body>
</html>
